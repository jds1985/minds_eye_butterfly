<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <defs>
    <filter id="furGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#furGlow)">
    <!-- Rear Paws -->
    <path d="M75 42 Q78 58 72 62" stroke="#120e17" stroke-width="5" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M75 42 Q78 58 72 62; M75 42 Q72 58 78 62; M75 42 Q78 58 72 62" dur="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M40 42 Q36 58 42 62" stroke="#120e17" stroke-width="5" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M40 42 Q36 58 42 62; M40 42 Q44 58 38 62; M40 42 Q36 58 42 62" dur="0.8s" repeatCount="indefinite" />
    </path>
    <!-- Body -->
    <ellipse cx="58" cy="38" rx="26" ry="14" fill="#17131e" transform="rotate(-3 58 38)"/>
    <!-- White Chest Badge -->
    <ellipse cx="44" cy="40" rx="6" ry="7" fill="#f0edf5" opacity="0.9"/>
    <!-- Front Paws -->
    <path d="M70 42 Q72 58 76 62" stroke="#1c1724" stroke-width="5" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M70 42 Q72 58 76 62; M70 42 Q76 58 68 62; M70 42 Q72 58 76 62" dur="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M35 42 Q38 58 34 62" stroke="#1c1724" stroke-width="5" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M35 42 Q38 58 34 62; M35 42 Q32 58 40 62; M35 42 Q38 58 34 62" dur="0.8s" repeatCount="indefinite" />
    </path>
    <!-- Head -->
    <circle cx="32" cy="30" r="11" fill="#1c1724"/>
    <!-- Ears -->
    <polygon points="26,24 23,12 30,21" fill="#17131e"/>
    <polygon points="34,22 39,13 37,24" fill="#17131e"/>
    <!-- Red Collar -->
    <path d="M34 34 Q30 38 27 34" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="29" cy="37" r="1.5" fill="#f59e0b"/>
    <!-- Amber Eye -->
    <ellipse cx="27" cy="29" rx="2.5" ry="2" fill="#fbbf24"/>
    <ellipse cx="26.5" cy="29" rx="0.8" ry="1.8" fill="#000"/>
    <!-- Animated Swishing Tail -->
    <path d="M82 36 Q98 32 94 18" stroke="#17131e" stroke-width="4.5" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M82 36 Q98 32 94 18; M82 36 Q102 24 96 12; M82 36 Q98 32 94 18" dur="1.2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
